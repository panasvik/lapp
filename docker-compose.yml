services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - sqlite_data:/data
      - uploads_data:/assets/uploads
      - ./.env:/.env:ro
    environment:
      - PORT=8080

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  sqlite_data:
  uploads_data:
  caddy_data:
  caddy_config:
